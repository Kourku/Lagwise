<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Lagwise</title>
  <meta name="theme-color" content="#0A0D13">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v=2">
  <script>try{var t=localStorage.getItem('lagwise-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/logo.png' | relative_url }}" alt="" width="30" height="30">Lagwise</a>
    <nav class="nav" aria-label="Main">
      <a class="hide-sm" href="{{ '/#how' | relative_url }}">How it works</a>
      <a class="hide-sm" href="{{ '/#features' | relative_url }}">Features</a>
      <a class="hide-sm" href="{{ '/PRIVACY' | relative_url }}">Privacy</a>
      <a class="hide-sm" href="https://github.com/Kourku/Lagwise">GitHub</a>
      <button class="theme-toggle" type="button" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="btn btn-primary btn-sm" href="https://github.com/Kourku/Lagwise/releases/latest">Download</a>
    </nav>
  </div>
</header>
<main class="doc">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 Fraxis · Lagwise (formerly NetPulse) · MIT licence</span>
    <nav aria-label="Footer">
      <a href="{{ '/PRIVACY' | relative_url }}">Privacy</a>
      <a href="https://github.com/Kourku/Lagwise/blob/main/SECURITY.md">Security</a>
      <a href="{{ '/METHODOLOGY' | relative_url }}">How it measures</a>
      <a href="{{ '/GAME_MONITOR' | relative_url }}">Game Monitor</a>
      <a href="https://github.com/Kourku/Lagwise/issues">Support</a>
    </nav>
  </div>
</footer>
<script src="{{ '/assets/site.js' | relative_url }}?v=2" defer></script>
</body>
</html>
